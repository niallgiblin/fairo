name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DFA_BUILD_STANDALONE=ON

      - name: Build plugin and tests
        run: cmake --build build --config Release --parallel

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure --config Release -L unit

      - name: Python sandbox cross-validation
        run: |
          python3 -m pip install -r python/requirements.txt
          python3 python/diode_clipper.py
          python3 python/tonestack.py

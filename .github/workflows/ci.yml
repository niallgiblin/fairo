name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Parked Phase 3 inference tests only — the plugin binary is DSP-only.
      - name: Download ONNX Runtime
        run: |
          ARCH=$(uname -m)
          ONNX_URL="https://github.com/microsoft/onnxruntime/releases/download/v1.24.4/onnxruntime-osx-${ARCH}-1.24.4.tgz"
          curl -sL "$ONNX_URL" -o /tmp/onnxruntime.tgz
          tar xzf /tmp/onnxruntime.tgz -C /tmp
          echo "ONNXRUNTIME_ROOT=/tmp/onnxruntime-osx-${ARCH}-1.24.4" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DFA_BUILD_STANDALONE=ON \
            -DFA_ENABLE_ONNX=ON -DONNXRUNTIME_ROOT="$ONNXRUNTIME_ROOT"

      - name: Build plugin and tests
        run: cmake --build build --config Release --parallel

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure --config Release -L unit

      - name: Python sandbox cross-validation
        run: |
          python3 -m pip install -r python/requirements.txt
          python3 python/diode_clipper.py
          python3 python/tonestack.py
